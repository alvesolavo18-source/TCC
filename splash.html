<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bem-vindo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:white;
}

.logo-container{
    position:relative;
    width:350px;
    height:350px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.logo-container img{
    width:300px;
    position:relative;
    z-index:1;
    animation:aparecer 1.5s;
}

.circulo{
    position:absolute;
    width:250px;
    height:250px;
    border:7px solid red;
    border-radius:50%;
    z-index:10;
    animation:girar 2s linear infinite;
}

@keyframes girar{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes aparecer{
    from{
        opacity:0;
        transform:scale(0.8);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}
</style>

</head>

<body>

    <div class="logo-container">
        <img src="Logo Oficial.png" alt="logo">
        <div class="circulo"></div>
    </div>

<script>

if(sessionStorage.getItem("logoJaMostrada")){
    window.location.href="trabalho.html";
}else{

    sessionStorage.setItem("logoJaMostrada","sim");

    setTimeout(function(){
        window.location.href="trabalho.html";
    },10000);

}

</script>

</body>
</html>
