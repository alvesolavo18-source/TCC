<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bem-vindo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:white;
}

.logo-container{
    position:relative;
    width:350px;
    height:350px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.logo-container img{
    width:300px;
    animation: aparecer 1.5s ease-out; 
}
/* Efeito da logo aumentando */
@keyframes aparecer{
    0%{
        opacity:0;
        transform:scale(0.5);
    }

    60%{
        opacity:1;
        transform:scale(1.08);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }
}

</style>

</head>

<body>

    <div class="logo-container">
        <img src="Logo Oficial.png" alt="logo">

    </div>

<script>

if(sessionStorage.getItem("logoJaMostrada")){
    window.location.href="trabalho.html";
}else{

    sessionStorage.setItem("logoJaMostrada","sim");

    setTimeout(function(){
        window.location.href="trabalho.html";
    },5000);

}

</script>

</body>
</html>
